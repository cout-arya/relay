services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["python", "-m", "relay.api.main"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://relay:relay@db:5432/relay
      DEMO_MODE: "1"
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy

  worker-1:
    build: .
    command: ["python", "-m", "relay.worker"]
    environment:
      DATABASE_URL: postgresql://relay:relay@db:5432/relay
      WORKER_QUEUES: default,llm
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy

  worker-2:
    build: .
    command: ["python", "-m", "relay.worker"]
    environment:
      DATABASE_URL: postgresql://relay:relay@db:5432/relay
      WORKER_QUEUES: default,llm
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
