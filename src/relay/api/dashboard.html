<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relay — Live Dashboard</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a28;
            --border: #2a2a3a;
            --text: #e0e0f0;
            --text-muted: #8888aa;
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.3);
            --green: #22c55e;
            --green-glow: rgba(34, 197, 94, 0.2);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.2);
            --yellow: #eab308;
            --blue: #3b82f6;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(124,92,255,0.05) 0%, transparent 100%);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1::before {
            content: '⚡';
            -webkit-text-fill-color: initial;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--green-glow);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--green);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--green-glow); }
            50% { opacity: 0.7; box-shadow: 0 0 0 6px transparent; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: all 0.2s ease;
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .stat-card .label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .stat-card .value.pending { color: var(--yellow); }
        .stat-card .value.running { color: var(--blue); }
        .stat-card .value.succeeded { color: var(--green); }
        .stat-card .value.dead { color: var(--red); }
        .stat-card .value.workers { color: var(--accent); }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-section {
            margin-bottom: 24px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--surface);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
        }

        .progress-segment {
            height: 100%;
            transition: width 0.5s ease;
        }

        .progress-segment.succeeded { background: var(--green); }
        .progress-segment.running { background: var(--blue); }
        .progress-segment.pending { background: var(--yellow); }
        .progress-segment.dead { background: var(--red); }

        .progress-legend {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th {
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(42, 42, 58, 0.5);
            font-variant-numeric: tabular-nums;
        }

        tr:hover td { background: rgba(124, 92, 255, 0.03); }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.dead { background: var(--red-glow); color: var(--red); }
        .badge.pending { background: rgba(234,179,8,0.15); color: var(--yellow); }
        .badge.running { background: rgba(59,130,246,0.15); color: var(--blue); }
        .badge.succeeded { background: var(--green-glow); color: var(--green); }

        .btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--accent);
            background: rgba(124, 92, 255, 0.1);
        }

        .btn-danger {
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--red);
        }

        .btn-danger:hover {
            background: var(--red-glow);
            border-color: var(--red);
        }

        .btn-replay {
            padding: 4px 10px;
            font-size: 0.7rem;
            border-color: rgba(34, 197, 94, 0.3);
            color: var(--green);
        }

        .btn-replay:hover {
            background: var(--green-glow);
            border-color: var(--green);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .two-col { grid-template-columns: 1fr; }
            .container { padding: 16px; }
            .header { padding: 16px; }
        }

        .error-text {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .cost { color: var(--green); font-weight: 600; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    </style>
</head>
<body>
    <div class="header">
        <h1>Relay Dashboard</h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Polling live</span>
        </div>
    </div>

    <div class="container">
        <!-- Stat Cards -->
        <div class="grid" id="stats-grid">
            <div class="card stat-card">
                <div class="label">Pending</div>
                <div class="value pending" id="stat-pending">—</div>
            </div>
            <div class="card stat-card">
                <div class="label">Running</div>
                <div class="value running" id="stat-running">—</div>
            </div>
            <div class="card stat-card">
                <div class="label">Succeeded</div>
                <div class="value succeeded" id="stat-succeeded">—</div>
            </div>
            <div class="card stat-card">
                <div class="label">Dead</div>
                <div class="value dead" id="stat-dead">—</div>
            </div>
            <div class="card stat-card">
                <div class="label">Active Workers</div>
                <div class="value workers" id="stat-workers">—</div>
            </div>
            <div class="card stat-card">
                <div class="label">Throughput /min</div>
                <div class="value" id="stat-throughput">—</div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-section">
            <div class="progress-bar" id="progress-bar"></div>
            <div class="progress-legend">
                <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Succeeded</div>
                <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div> Running</div>
                <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div> Pending</div>
                <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> Dead</div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions" id="demo-actions" style="display: none;">
            <button class="btn btn-danger" onclick="killWorker()">💀 Kill a Worker</button>
            <button class="btn" onclick="enqueueTestJobs()">📋 Enqueue 10 Test Jobs</button>
        </div>

        <div class="two-col">
            <!-- Workers -->
            <div class="card">
                <div class="section-title">🖥 Workers</div>
                <div id="workers-table">
                    <div class="empty-state">Loading...</div>
                </div>
            </div>

            <!-- Dead Letters -->
            <div class="card">
                <div class="section-title">💀 Dead-Letter Queue</div>
                <div id="dead-table">
                    <div class="empty-state">Loading...</div>
                </div>
            </div>
        </div>

        <!-- LLM Usage -->
        <div class="card" style="margin-top: 24px;">
            <div class="section-title">🤖 LLM Usage &amp; Cost</div>
            <div id="llm-usage">
                <div class="empty-state">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const POLL_INTERVAL = 1000;
        let demoMode = false;

        async function fetchJSON(url) {
            try {
                const r = await fetch(url);
                return r.ok ? await r.json() : null;
            } catch { return null; }
        }

        function updateStats(data) {
            if (!data) return;
            const s = data.by_status || {};
            document.getElementById('stat-pending').textContent = s.pending || 0;
            document.getElementById('stat-running').textContent = s.running || 0;
            document.getElementById('stat-succeeded').textContent = s.succeeded || 0;
            document.getElementById('stat-dead').textContent = s.dead || 0;
            document.getElementById('stat-workers').textContent = data.active_workers || 0;
            document.getElementById('stat-throughput').textContent = data.throughput_1m || 0;

            // Progress bar
            const total = (s.pending||0) + (s.running||0) + (s.succeeded||0) + (s.dead||0);
            const bar = document.getElementById('progress-bar');
            if (total > 0) {
                bar.innerHTML = `
                    <div class="progress-segment succeeded" style="width:${(s.succeeded||0)/total*100}%"></div>
                    <div class="progress-segment running" style="width:${(s.running||0)/total*100}%"></div>
                    <div class="progress-segment pending" style="width:${(s.pending||0)/total*100}%"></div>
                    <div class="progress-segment dead" style="width:${(s.dead||0)/total*100}%"></div>`;
            }
        }

        function updateWorkers(workers) {
            const el = document.getElementById('workers-table');
            if (!workers || workers.length === 0) {
                el.innerHTML = '<div class="empty-state">No active workers</div>';
                return;
            }
            let html = '<table><tr><th>ID</th><th>PID</th><th>Host</th><th>Last Seen</th></tr>';
            for (const w of workers) {
                const ts = w.last_seen ? new Date(w.last_seen).toLocaleTimeString() : '?';
                html += `<tr><td style="font-size:0.75rem">${w.id}</td><td>${w.pid}</td><td>${w.host}</td><td>${ts}</td></tr>`;
            }
            el.innerHTML = html + '</table>';
        }

        function updateDead(jobs) {
            const el = document.getElementById('dead-table');
            if (!jobs || jobs.length === 0) {
                el.innerHTML = '<div class="empty-state">No dead-letter jobs 🎉</div>';
                return;
            }
            let html = '<table><tr><th>ID</th><th>Type</th><th>Attempts</th><th>Error</th><th></th></tr>';
            for (const j of jobs) {
                const err = (j.last_error || '').substring(0, 50);
                html += `<tr>
                    <td>${j.id}</td>
                    <td><span class="badge dead">${j.type}</span></td>
                    <td>${j.attempts}</td>
                    <td class="error-text">${err}</td>
                    <td><button class="btn btn-replay" onclick="replayJob(${j.id})">↻ Replay</button></td>
                </tr>`;
            }
            el.innerHTML = html + '</table>';
        }

        function updateLLM(data) {
            const el = document.getElementById('llm-usage');
            if (!data || (data.total_input_tokens === 0 && data.total_output_tokens === 0)) {
                el.innerHTML = '<div class="empty-state">No LLM usage recorded</div>';
                return;
            }
            el.innerHTML = `
                <div style="display:flex;gap:32px;margin-bottom:16px;">
                    <div><span style="color:var(--text-muted)">Input tokens:</span> <strong>${data.total_input_tokens.toLocaleString()}</strong></div>
                    <div><span style="color:var(--text-muted)">Output tokens:</span> <strong>${data.total_output_tokens.toLocaleString()}</strong></div>
                    <div><span style="color:var(--text-muted)">Total cost:</span> <strong class="cost">$${data.total_cost_usd.toFixed(4)}</strong></div>
                </div>`;
        }

        async function replayJob(id) {
            await fetch(`/dead/${id}/replay`, { method: 'POST' });
        }

        async function killWorker() {
            const r = await fetch('/demo/kill-worker', { method: 'POST' });
            const data = await r.json();
            if (data.killed) {
                alert(`Killed worker: ${data.killed} (PID ${data.pid})`);
            } else {
                alert(data.error || 'Failed to kill worker');
            }
        }

        async function enqueueTestJobs() {
            for (let i = 0; i < 10; i++) {
                await fetch('/jobs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'sleep', payload: { seconds: 5 }, priority: Math.floor(Math.random() * 10) })
                });
            }
        }

        async function poll() {
            const [stats, workers, dead, llm] = await Promise.all([
                fetchJSON('/stats'),
                fetchJSON('/workers'),
                fetchJSON('/dead?limit=10'),
                fetchJSON('/llm/usage'),
            ]);
            updateStats(stats);
            updateWorkers(workers);
            updateDead(dead);
            updateLLM(llm);

            // Check demo mode
            try {
                const health = await fetchJSON('/health');
                if (health) {
                    document.getElementById('demo-actions').style.display = 'flex';
                    demoMode = true;
                }
            } catch {}
        }

        poll();
        setInterval(poll, POLL_INTERVAL);
    </script>
</body>
</html>
