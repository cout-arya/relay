<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" style="background:#0a0a0f; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161622" />
      <stop offset="100%" stop-color="#101018" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c5cff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#22c55e" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="45" text-anchor="middle" fill="url(#grad-accent)" font-size="24" font-weight="bold">Relay Architecture &amp; Delivery Model</text>
  <text x="480" y="70" text-anchor="middle" fill="#8888aa" font-size="13">PostgreSQL-Backed Durable Queue with Mutual Exclusion by Lease &amp; Fencing Tokens</text>

  <!-- Producers Section -->
  <rect x="40" y="105" width="220" height="120" rx="12" fill="url(#grad-card)" stroke="#2a2a3a" stroke-width="1.5" />
  <text x="150" y="135" text-anchor="middle" fill="#c3b5ff" font-size="15" font-weight="bold">Producers</text>
  <text x="150" y="165" text-anchor="middle" fill="#e0e0f0" font-size="13">HTTP Clients (Apps, curl)</text>
  <text x="150" y="188" text-anchor="middle" fill="#e0e0f0" font-size="13">Relay CLI (Typer)</text>
  <text x="150" y="210" text-anchor="middle" fill="#8888aa" font-size="11">POST /jobs (Idempotency Key)</text>

  <!-- API Server Section -->
  <rect x="370" y="105" width="220" height="120" rx="12" fill="url(#grad-card)" stroke="#7c5cff" stroke-width="1.5" />
  <text x="480" y="135" text-anchor="middle" fill="#c3b5ff" font-size="15" font-weight="bold">FastAPI Service</text>
  <text x="480" y="165" text-anchor="middle" fill="#e0e0f0" font-size="13">/jobs  &amp;  /stats</text>
  <text x="480" y="188" text-anchor="middle" fill="#e0e0f0" font-size="13">/dead &amp; /dead/replay</text>
  <text x="480" y="210" text-anchor="middle" fill="#8888aa" font-size="11">Live Dashboard &amp; Demo Mode</text>

  <!-- PostgreSQL Database (Center of Truth) -->
  <rect x="690" y="105" width="230" height="400" rx="12" fill="url(#grad-card)" stroke="#3b82f6" stroke-width="2" />
  <text x="805" y="138" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="bold">PostgreSQL 16</text>
  <text x="805" y="160" text-anchor="middle" fill="#8888aa" font-size="11">Single Coordination Mechanism</text>

  <rect x="705" y="180" width="200" height="34" rx="6" fill="#1c2030" stroke="#2d3748" />
  <text x="805" y="202" text-anchor="middle" fill="#e2e8f0" font-size="12">jobs (SKIP LOCKED index)</text>

  <rect x="705" y="224" width="200" height="34" rx="6" fill="#1c2030" stroke="#2d3748" />
  <text x="805" y="246" text-anchor="middle" fill="#e2e8f0" font-size="12">job_attempts (Fencing Audit)</text>

  <rect x="705" y="268" width="200" height="34" rx="6" fill="#1c2030" stroke="#2d3748" />
  <text x="805" y="290" text-anchor="middle" fill="#e2e8f0" font-size="12">effects (Idempotent PK)</text>

  <rect x="705" y="312" width="200" height="34" rx="6" fill="#1c2030" stroke="#2d3748" />
  <text x="805" y="334" text-anchor="middle" fill="#e2e8f0" font-size="12">job_dependencies (DAG)</text>

  <rect x="705" y="356" width="200" height="34" rx="6" fill="#1c2030" stroke="#2d3748" />
  <text x="805" y="378" text-anchor="middle" fill="#e2e8f0" font-size="12">queue_config (Concurrency)</text>

  <rect x="705" y="400" width="200" height="34" rx="6" fill="#1c2030" stroke="#2d3748" />
  <text x="805" y="422" text-anchor="middle" fill="#e2e8f0" font-size="12">workers (Heartbeats/Registry)</text>

  <rect x="705" y="444" width="200" height="34" rx="6" fill="#1c2030" stroke="#2d3748" />
  <text x="805" y="466" text-anchor="middle" fill="#e2e8f0" font-size="12">llm_usage (Tokens &amp; Cost)</text>

  <!-- Worker Process Section -->
  <rect x="150" y="300" width="440" height="205" rx="12" fill="url(#grad-card)" stroke="#22c55e" stroke-width="1.5" />
  <text x="370" y="330" text-anchor="middle" fill="#4ade80" font-size="15" font-weight="bold">Independent Worker Processes (1..N)</text>

  <rect x="170" y="350" width="125" height="70" rx="8" fill="#12241b" stroke="#166534" />
  <text x="232" y="378" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">Claim Loop</text>
  <text x="232" y="400" text-anchor="middle" fill="#8888aa" font-size="10">SKIP LOCKED</text>

  <rect x="310" y="350" width="125" height="70" rx="8" fill="#12241b" stroke="#166534" />
  <text x="372" y="378" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">Heartbeat Thread</text>
  <text x="372" y="400" text-anchor="middle" fill="#8888aa" font-size="10">lease_s / 3</text>

  <rect x="450" y="350" width="125" height="70" rx="8" fill="#12241b" stroke="#166534" />
  <text x="512" y="378" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">Handlers</text>
  <text x="512" y="400" text-anchor="middle" fill="#8888aa" font-size="10">noop / transfer / llm</text>

  <rect x="170" y="435" width="405" height="50" rx="8" fill="#1b1c24" stroke="#2d3142" />
  <text x="372" y="458" text-anchor="middle" fill="#c3b5ff" font-size="12" font-weight="bold">Fenced Ack / Fail &amp; Periodic Reaper</text>
  <text x="372" y="475" text-anchor="middle" fill="#8888aa" font-size="10">Fencing Token (attempts) ensures expired worker cannot corrupt newer attempts</text>

  <!-- Connectors -->
  <!-- Producer -> API -->
  <line x1="260" y1="165" x2="362" y2="165" stroke="#7c5cff" stroke-width="2" marker-end="url(#arrow)" />
  <!-- API -> DB -->
  <line x1="590" y1="165" x2="682" y2="165" stroke="#7c5cff" stroke-width="2" marker-end="url(#arrow)" />

  <!-- DB -> Workers (Claim) -->
  <path d="M 690 200 L 630 200 L 630 385 L 590 385" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="645" y="295" text-anchor="middle" fill="#86efac" font-size="11" transform="rotate(-90 645 295)">Claim Job</text>

  <!-- Workers -> DB (Heartbeat / Ack / Fail) -->
  <path d="M 590 440 L 690 440" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="640" y="432" text-anchor="middle" fill="#93c5fd" font-size="11">Fenced Ack/Fail</text>

  <!-- Bottom Legend / Guarantees -->
  <rect x="40" y="515" width="880" height="30" rx="6" fill="#11111a" stroke="#222233" />
  <text x="480" y="535" text-anchor="middle" fill="#8888aa" font-size="11">Delivery Guarantees: At-Least-Once Delivery · Mutual Exclusion by Leases · Fenced Operations · Idempotent Side Effects</text>
</svg>

